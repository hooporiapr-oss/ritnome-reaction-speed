<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ritnome Basketball · Access</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;color:#fff;
    background:#000;
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
  }

  #stage{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:24px;
    background:radial-gradient(ellipse at center,#001018 0%,#000 70%);
  }

  #panel{width:100%;max-width:400px;text-align:center}
  .sub{font-size:.85rem;color:#9fb3c8;letter-spacing:.02em;margin-bottom:44px}

  .code-panel{width:100%}
  .code-label{font-size:.68rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8892a0;margin-bottom:10px}
  .code-input{
    width:100%;padding:16px;border-radius:12px;border:2px solid rgba(0,229,255,.4);
    background:rgba(255,255,255,.05);color:#fff;font-size:1.4rem;font-weight:900;
    letter-spacing:.25em;text-transform:uppercase;text-align:center;font-family:'Courier New',monospace;
  }
  .code-input:focus{outline:none;border-color:#00e5ff;box-shadow:0 0 24px rgba(0,229,255,.35)}
  .code-input.shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

  .enter-btn{
    width:100%;margin-top:16px;padding:15px;border:none;border-radius:12px;
    background:linear-gradient(135deg,#00e5ff,#0091ff);color:#031018;
    font-size:1rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
    box-shadow:0 0 30px rgba(0,229,255,.5);
  }
  .enter-btn:active{transform:scale(.98)}
  .enter-btn:disabled{opacity:.6;cursor:default;box-shadow:none}

  .err{margin-top:14px;color:#ff8888;font-size:.85rem;font-weight:700;min-height:18px}

  .brandmark{margin-top:50px;font-size:.68rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#4a5058}
  .brandmark b{color:#8892a0;font-style:italic}

  .gate-title{font-size:1.8rem;font-weight:900;font-style:italic;letter-spacing:.02em;text-transform:uppercase;margin-bottom:10px;text-shadow:0 0 30px rgba(0,229,255,.6)}
  .gate-title span{color:#00e5ff}
  @media(max-width:480px){ .gate-title{font-size:1.35rem} }
</style>
</head>
<body>

<div id="stage">
  <div id="panel">
    <div class="gate-title">RIT<span>NOME</span></div>
    <div class="sub" id="gate-sub">Enter Your Access Code</div>

    <div class="code-panel" id="code-panel">
      <div class="code-label">Access Code</div>
      <input class="code-input" id="gate-code" maxlength="40" placeholder="• • • •" autocomplete="off" onkeydown="if(event.key==='Enter')tryEnter()">
      <button class="enter-btn" id="gate-btn" onclick="tryEnter()">Enter Ritnome →</button>
      <div class="err" id="gate-err"></div>
    </div>

    <a href="ritnome-standings-gate.html" style="display:inline-block;margin-top:20px;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8892a0;text-decoration:none">🏆 View Standings →</a>

    <div class="brandmark">Powered by <b>Gostar Digital</b></div>
  </div>
</div>

<script>
var $=function(id){return document.getElementById(id)};

// ══════════════════════════════════════════════════════
//  LICENSE SYSTEM — its own distinct session key
//  ('ritnome-gate-pass') and its own distinct product scope
//  ('ritnome') in the SAME Supabase licenses table every other
//  product already uses. A code issued for any other product on
//  this platform will NOT unlock this gate, and vice versa, even
//  though all of them live in the same table. To issue / expire /
//  revoke Ritnome licenses, use admin.html.
//
//  The licenses table is NOT readable from the browser. This page
//  asks the database one question through the check_license
//  function — "is this code good for this product?" — and gets
//  back only a yes or no plus the school name. Nobody can list the
//  codes, because nothing here can read the table.
//
//  Expiry is judged inside that function, on the database's own
//  clock, so an expired code cannot be waved through by editing
//  this page or changing a device's date.
// ══════════════════════════════════════════════════════
var SUPABASE_URL = 'https://sdaphocueugzfvjovuxd.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkYXBob2N1ZXVnemZ2am92dXhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjQyMDgsImV4cCI6MjA5OTIwMDIwOH0.pDAzf4P6dD9eNEBlnP95SdF5BI-R84-Rdc0vKzYcn7M';
var PRODUCT = 'ritnome';
// ══════════════════════════════════════════════════════

var checking = false;

function tryEnter(){
  if (checking) return;

  var input = $('gate-code').value.trim();
  if (!input){ return; }

  checking = true;
  $('gate-btn').disabled = true;
  $('gate-err').style.color = '';
  $('gate-err').textContent = 'Checking…';

  fetch(SUPABASE_URL + '/rest/v1/rpc/check_license', {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ p_code: input, p_product: PRODUCT })
  })
  .then(function(r){
    if (!r.ok) throw new Error('lookup failed');
    return r.json();
  })
  .then(function(lic){
    if (!lic || !lic.ok){
      return reject('Invalid or expired code — check with your administrator');
    }

    sessionStorage.setItem('ritnome-gate-pass','1');
    sessionStorage.setItem('ritnome-license', input.toUpperCase());
    sessionStorage.setItem('ritnome-school', lic.school_name || '');
    window.location.href = 'ritnome.html';
  })
  .catch(function(){
    // A network or server failure is a different problem from a bad
    // code, and saying so saves someone hunting for a typo that
    // isn't there.
    reject('Connection problem — please try again');
  });
}

function reject(msg){
  checking = false;
  $('gate-btn').disabled = false;
  $('gate-err').style.color = '#ff8888';
  $('gate-err').textContent = msg;
  var box = $('gate-code');
  box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
  box.value=''; box.focus();
}

$('gate-code').focus();
</script>
</body>
</html>
